<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 0 15px;
        }

        .container {
            max-width: 600px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            margin-top: 30px;
        }

        img {
            max-width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(5px 5px 10px #3498db);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-style: italic;
            opacity: 0.8;
        }

        .tech-list {
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .tech-list p {
            margin: 0;
            font-weight: 500;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 70%;
            padding: 12px 15px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }

        button {
            padding: 12px 15px;
            border: none;
            background-color: #2193b0;
            color: white;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #6dd5ed;
            transform: scale(1.1);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            input[type="text"] {
                width: 65%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="images/logo-weather.png" alt="Weather App Logo" height = 150px width = 200px>
        <h1>Weather App</h1>
        <h3>Get your daily weather updates</h3>

        <div class="tech-list">
            <h2>Technologies Used:</h2>
            <p>HTML, CSS, JavaScript, Java, Servlet, JSP, OpenWeather API</p>
        </div>

        <form action="MyServlet" method="post">
            <input type="text" placeholder="Enter City Name" id="searchInput" value="Agra" name="city">
            <button id="searchButton"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
    </div>

    <footer>
        &copy; 2025 Weather App. All rights reserved. Created by Bhupendra Verma
    </footer>
</body>
</html>
